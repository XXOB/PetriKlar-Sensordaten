name: Referenzwerte AT

# Vergleichswerte fuer die Pegelkarte in Oesterreich: je Pegel das 10., 50.
# und 90. Perzentil der Tagesmittel aus dem juengsten vollstaendigen eHYD-
# Archivjahr. Die Archive aendern sich nur selten, darum einmal im Monat.
on:
  schedule:
    - cron: "40 3 2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: referenzwerte-AT
  cancel-in-progress: false

jobs:
  update:
    # Fest auf 24.04: Seit der Umstellung von ubuntu-latest auf Ubuntu 26
    # (ab 19.10.2026) lehnen mehrere Behoerdenserver die Abrufe ab.
    runs-on: ubuntu-24.04
    # Behoerdenserver, die GitHub-Server abweisen, werden ueber petriklar.com
    # abgerufen (relay_client/petriklar_relay.py). Ohne Secret: direkter Abruf.
    env:
      PYTHONPATH: ${{ github.workspace }}/relay_client
      PETRIKLAR_RELAY_URL: https://www.petriklar.com/relay/fetch.php
      PETRIKLAR_RELAY_KEY: ${{ secrets.PETRIKLAR_RELAY_KEY }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Vergleichswerte aus den eHYD-Tagesmitteln berechnen
        run: python austria_level_references.py --stations countries/AT/current/europe-water.json
      - name: Speichern
        run: |
          git add austria-level-references.json
          bash commit_sensor_data.sh

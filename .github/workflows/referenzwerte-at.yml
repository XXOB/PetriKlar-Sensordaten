name: Referenzwerte AT

# Vergleichswerte fuer die Pegelkarte in Oesterreich: je Pegel das 10., 50.
# und 90. Perzentil der Tagesmittel aus dem juengsten vollstaendigen eHYD-
# Archivjahr. Die Archive aendern sich nur selten, darum einmal im Monat.
on:
  schedule:
    - cron: "40 3 2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: referenzwerte-AT
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Vergleichswerte aus den eHYD-Tagesmitteln berechnen
        run: python austria_level_references.py --stations countries/AT/current/europe-water.json
      - name: Speichern
        run: |
          git add austria-level-references.json
          bash commit_sensor_data.sh

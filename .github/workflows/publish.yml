name: Sensordaten veröffentlichen
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
  workflow_run:
    workflows: [Messwerte, Pegelhistorie ergänzen, Temperaturarchiv nachtragen]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sensor-pages-publish
  cancel-in-progress: false
jobs:
  update:
    # Fest auf 24.04: Seit der Umstellung von ubuntu-latest auf Ubuntu 26
    # (ab 19.10.2026) lehnen mehrere Behoerdenserver die Abrufe ab.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python country_pipeline.py publish
      - run: python build_sensor_packets.py --root . --output packets
      - name: Öffentlichen Datenordner erzeugen
        run: |
          mkdir -p _site
          cp wasserwerte.json _site/
          # Metadata and already-public readings for the password-protected
          # Netcup admin audit. No additional authority request occurs here.
          cp niz_temperature.json _site/
          mkdir -p _site/tools
          cp tools/discovery-network-snapshot.json _site/tools/
          cp pegelkarte.json _site/
          cp europe-water.json _site/
          cp europe-temperature.json europe-level.json europe-directory.json _site/
          cp -r packets _site/
          mkdir -p _site/assets/data
          for file in lfu-brandenburg-current.json extra-sensors.json river-sensor-additions.json uk-river-sensors.json uk-river-temperatures.json; do
            [ ! -f "assets/data/$file" ] || cp "assets/data/$file" _site/assets/data/
          done
          cp wassertemperatur_verlauf.json _site/
          [ ! -f temperatur_zusatz.json ] || cp temperatur_zusatz.json _site/
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetriKlar Sensordaten</title><body><h1>PetriKlar Sensordaten</h1><p>Öffentliche, automatisiert konsolidierte Messdaten.</p><ul><li><a href="wasserwerte.json">Aktuelle Wasserwerte</a></li><li><a href="wassertemperatur_verlauf.json">Temperaturverlauf</a></li></ul></body></html>
          EOF

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Daten als Pages-Artefakt packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Datendateien veröffentlichen
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4


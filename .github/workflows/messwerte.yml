# Alle vier Laender in einem Lauf.
#
# Vorher lagen DE, AT, CH und NL in vier getrennten Workflows mit eigenem
# Cron. GitHub drosselt geplante Laeufe pro Repository: die vier liefen
# tatsaechlich nur alle vier bis sechs Stunden und zu verschiedenen Zeiten.
# Damit lagen die Laender-Messwerte regelmaessig Stunden auseinander, und das
# Vier-Stunden-Fenster der Flussprofile behielt nur ein Land uebrig.
#
# Reihenfolge und Fehlertoleranz sind bewusst gewaehlt:
#   1. leichte Abhaengigkeiten, dann AT, CH, NL - wenige Minuten, kein Browser
#   2. Zwischenspeichern, damit ein Abbruch im langen DE-Teil sie nicht mitnimmt
#   3. Playwright/Chromium, dann DE und die deutschen Zusatzquellen
#   4. abschliessend speichern, auch wenn vorher etwas schiefging
# Jeder Abrufschritt darf scheitern, ohne den Rest zu stoppen. Schlaegt ein
# Land fehl, bleibt dessen letzter datierter Stand erhalten und erscheint im
# Lauf als Warnung - der Rest wird trotzdem geholt und veroeffentlicht.

name: Messwerte

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: messwerte
  cancel-in-progress: false

jobs:
  update:
    name: Amtliche Messwerte abrufen
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bewusst getrennt: die drei schnellen Laender brauchen keinen Browser
      # und sollen nicht an einer fehlgeschlagenen Chromium-Installation
      # scheitern.
      - name: Leichte Abhaengigkeiten
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyproj beautifulsoup4

      - name: Oesterreich
        timeout-minutes: 12
        run: python country_pipeline.py AT || echo "::warning::AT nicht aktualisiert; letzter Stand bleibt erhalten."

      - name: Schweiz
        timeout-minutes: 10
        run: python country_pipeline.py CH || echo "::warning::CH nicht aktualisiert; letzter Stand bleibt erhalten."

      - name: Niederlande
        timeout-minutes: 10
        run: python country_pipeline.py NL || echo "::warning::NL nicht aktualisiert; letzter Stand bleibt erhalten."

      - name: Laender zwischenspeichern
        run: |
          for land in AT CH NL; do
            [ ! -d "countries/$land/current" ] || git add "countries/$land/current"
          done
          bash commit_sensor_data.sh

      - name: Playwright und Chromium installieren
        timeout-minutes: 10
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      # fetch_wasserwerte.py schreibt wasserwerte.json erst ganz am Ende in
      # einem Rutsch. Bricht der Abruf ab, bleibt die letzte vollstaendige
      # Datei unveraendert liegen - deshalb darf der Schritt scheitern.
      - name: Deutschland
        timeout-minutes: 25
        env:
          PETRIKLAR_COUNTRY: DE
        run: |
          python fetch_wasserwerte.py || {
            echo "::warning::DE nicht aktualisiert; letzter datierter Stand bleibt erhalten."
            test -s wasserwerte.json
          }

      - name: Pegelkarte mit amtlichen Kennwerten aktualisieren
        if: always()
        timeout-minutes: 6
        run: |
          python fetch_water_levels.py --output pegelkarte.json --austria wasserwerte.json || {
            echo "::warning::Pegelabruf fehlgeschlagen; letzter datierter Stand bleibt erhalten."
            test -s pegelkarte.json
          }

      - name: Neckar-Temperaturen aus dem amtlichen NIZ abrufen
        if: always()
        timeout-minutes: 2
        run: |
          python fetch_niz_temperature.py --output niz_temperature.json || {
            echo "::warning::NIZ-Abruf fehlgeschlagen; letzter Stand bleibt erhalten."
            test -s niz_temperature.json
          }

      - name: Eigenes Pegelarchiv fuer Stationen ohne Kennwerte
        if: always()
        timeout-minutes: 8
        run: |
          python pegel_tageswerte.py --pegelkarte pegelkarte.json || echo "::warning::Pegelarchiv nicht aktualisiert; Pegelkarte bleibt unveraendert."

      - name: Daten speichern
        if: always()
        run: |
          for file in wasserwerte.json wassertemperatur_verlauf.json pegelkarte.json niz_temperature.json \
                      pegel-tageswerte.json temperatur_zusatz.json gkd_coords.json nlwkn_coords.json \
                      undine_coords.json berlin_coords.json; do
            [ ! -f "$file" ] || git add "$file"
          done
          for land in AT CH NL; do
            [ ! -d "countries/$land/current" ] || git add "countries/$land/current"
          done
          bash commit_sensor_data.sh

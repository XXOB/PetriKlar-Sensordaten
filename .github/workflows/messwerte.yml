# Alle vier Laender in einem Lauf.
#
# Vorher lagen DE, AT, CH und NL in vier getrennten Workflows mit eigenem
# Cron. GitHub drosselt geplante Laeufe pro Repository: die vier liefen
# tatsaechlich nur alle vier bis sechs Stunden und zu verschiedenen Zeiten.
# Damit lagen die Laender-Messwerte regelmaessig Stunden auseinander, und das
# Vier-Stunden-Fenster der Flussprofile behielt nur ein Land uebrig.
#
# Reihenfolge und Fehlertoleranz sind bewusst gewaehlt:
#   1. leichte Abhaengigkeiten, dann AT, CH, NL - wenige Minuten, kein Browser
#   2. Zwischenspeichern, damit ein Abbruch im langen DE-Teil sie nicht mitnimmt
#   3. Playwright/Chromium, dann DE und die deutschen Zusatzquellen
#   4. abschliessend speichern, auch wenn vorher etwas schiefging
# Jeder Abrufschritt darf scheitern, ohne den Rest zu stoppen. Schlaegt ein
# Land fehl, bleibt dessen letzter datierter Stand erhalten und erscheint im
# Lauf als Warnung - der Rest wird trotzdem geholt und veroeffentlicht.

name: Messwerte

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: messwerte
  cancel-in-progress: false

jobs:
  update:
    name: Amtliche Messwerte abrufen
    # Fest auf 24.04: Seit der Umstellung von ubuntu-latest auf Ubuntu 26
    # (ab 19.10.2026) lehnen mehrere Behoerdenserver die Abrufe ab.
    runs-on: ubuntu-24.04
    # Behoerdenserver, die GitHub-Server abweisen, werden ueber petriklar.com
    # abgerufen (relay_client/petriklar_relay.py). Ohne Secret: direkter Abruf.
    env:
      PYTHONPATH: ${{ github.workspace }}/relay_client
      PETRIKLAR_RELAY_URL: https://www.petriklar.com/relay/fetch.php
      PETRIKLAR_RELAY_KEY: ${{ secrets.PETRIKLAR_RELAY_KEY }}
    timeout-minutes: 55
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bewusst getrennt: die drei schnellen Laender brauchen keinen Browser
      # und sollen nicht an einer fehlgeschlagenen Chromium-Installation
      # scheitern.
      - name: Leichte Abhaengigkeiten
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyproj beautifulsoup4

      - name: Deutsche Temperaturadapter pruefen
        timeout-minutes: 2
        run: |
          python -m unittest discover -s tests -p 'test_undine.py' -v
          python -m unittest discover -s tests -p 'test_lfu_brandenburg_temperature.py' -v
          python -m unittest discover -s tests -p 'test_temperature_snapshot_recovery.py' -v

      - name: Oesterreich
        timeout-minutes: 12
        run: python country_pipeline.py AT || echo "::warning::AT nicht aktualisiert; letzter Stand bleibt erhalten."

      # Offline contract tests: all twelve additional UK rivers must match their
      # own geometry before the later UK collection steps use it. No extra API call.
      - name: UK-Flusszuordnung und Ungarn-Temperaturimport pruefen
        timeout-minutes: 2
        run: |
          python -m unittest discover -s tests -p 'test_uk*.py' -v
          python -m unittest discover -s tests -p 'test_hungary_sources.py' -v

      - name: Schweiz
        timeout-minutes: 10
        run: python country_pipeline.py CH || echo "::warning::CH nicht aktualisiert; letzter Stand bleibt erhalten."

      - name: Niederlande
        timeout-minutes: 10
        run: python country_pipeline.py NL || echo "::warning::NL nicht aktualisiert; letzter Stand bleibt erhalten."

      - name: Laender zwischenspeichern
        run: |
          for land in AT CH NL; do
            [ ! -d "countries/$land/current" ] || git add "countries/$land/current"
          done
          bash commit_sensor_data.sh

      - name: Playwright und Chromium installieren
        timeout-minutes: 10
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      # fetch_wasserwerte.py schreibt wasserwerte.json erst ganz am Ende in
      # einem Rutsch. Bricht der Abruf ab, bleibt die letzte vollstaendige
      # Datei unveraendert liegen - deshalb darf der Schritt scheitern.
      - name: Deutschland
        timeout-minutes: 25
        env:
          PETRIKLAR_COUNTRY: DE
        run: |
          python fetch_wasserwerte.py || {
            echo "::warning::DE nicht aktualisiert; letzter datierter Stand bleibt erhalten."
            test -s wasserwerte.json
          }

      - name: Pegelkarte mit amtlichen Kennwerten aktualisieren
        if: always()
        timeout-minutes: 6
        run: |
          python fetch_water_levels.py --output pegelkarte.json --austria wasserwerte.json || {
            echo "::warning::Pegelabruf fehlgeschlagen; letzter datierter Stand bleibt erhalten."
            test -s pegelkarte.json
          }

      - name: Flusstemperaturen aus dem amtlichen NIZ abrufen
        if: always()
        timeout-minutes: 2
        run: |
          python fetch_niz_temperature.py --output niz_temperature.json || {
            echo "::warning::NIZ-Abruf fehlgeschlagen; letzter Stand bleibt erhalten."
            test -s niz_temperature.json
          }

      # Havel (Potsdam) und Spree: Das LfU Brandenburg veroeffentlicht den
      # aktuellen Wert nur im Titel seiner 31-Tage-Diagramme; die CSV hinkt
      # Wochen hinterher. Der Abruf lief frueher nur in PetriKlar-Source - die
      # Live-Karte liest aber dieses Repository, und die Havel fiel aus.
      - name: Elbe-, Havel- und Spree-Temperaturen aus LfU-Diagrammen lesen
        if: always()
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu
          python -m pip install Pillow
          python fetch_lfu_brandenburg_temperatures.py || {
            echo "::warning::LfU-Diagramm konnte nicht gelesen werden; letzter gespeicherter Stand bleibt erhalten."
            test -s assets/data/lfu-brandenburg-current.json
          }

      # Britische Pegel und Wassertemperaturen werden hier zentral mit den
      # übrigen amtlichen Quellen abgerufen. PetriKlar-Source kopiert danach
      # ausschliesslich diese gespeicherten Ergebnisse.
      - name: Britische Flusspegel aus EA und SEPA aktualisieren
        if: always()
        timeout-minutes: 15
        run: |
          python fetch_uk_river_sensors.py || {
            echo "::warning::UK-Pegel nicht aktualisiert; letzter Stand bleibt erhalten."
            test -s assets/data/uk-river-sensors.json
          }

      - name: Britische Wassertemperaturen aus der EA Hydrology API aktualisieren
        if: always()
        # Current catalogue/readings plus six bounded history requests for 33 sites.
        # Allow their 90-second timeouts without killing the useful current values.
        timeout-minutes: 15
        run: |
          python fetch_uk_river_temperatures.py || {
            echo "::warning::UK-Wassertemperaturen nicht aktualisiert; letzter Stand bleibt erhalten."
            test -s assets/data/uk-river-temperatures.json
          }

      # Mur (ARSO, Slowenien) und Donau unterhalb Oesterreichs: Kroatien (DHMZ),
      # Serbien (RHMZ), Rumaenien (AFDJ), Bulgarien (APPD), Ungarn (OVF). Slowakei
      # bleibt ohne bestaetigte Weiterverwendung ausgenommen. Ungarn: OVF Open Data.
      - name: Mur- und Donau-Messstellen ausserhalb DE/AT abrufen
        if: always()
        timeout-minutes: 7
        run: |
          python fetch_extra_sensors.py || {
            echo "::warning::Zusatzquellen nicht vollständig erreichbar; letzter Stand bleibt erhalten."
            test -s assets/data/extra-sensors.json || true
          }

      # Drau/Mur (Kaernten, Steiermark), Maas/Mosel/Rhone (Hub'Eau) und Ticino
      # (ARPA Lombardia). Lief frueher nur im Website-Repository.
      - name: Mur-, Drau-, Maas-, Mosel-, Rhone- und Ticino-Pegel abrufen
        if: always()
        timeout-minutes: 8
        run: |
          python fetch_river_sensor_additions.py || {
            echo "::warning::Zusatz-Pegel nicht vollstaendig aktualisiert; letzter Stand bleibt erhalten."
            test -s assets/data/river-sensor-additions.json
          }

      - name: Eigenes Pegelarchiv fuer Stationen ohne Kennwerte
        if: always()
        timeout-minutes: 8
        run: |
          python pegel_tageswerte.py --pegelkarte pegelkarte.json || echo "::warning::Pegelarchiv nicht aktualisiert; Pegelkarte bleibt unveraendert."

      # Diese Verzeichnis-Snapshots werden ebenfalls in diesem einzigen
      # Messwerte-Lauf abgefragt und von PetriKlar-Source nur noch übernommen.
      - name: Öffentliche Stationsinventare und Pegelverläufe aktualisieren
        if: always()
        timeout-minutes: 5
        run: |
          python tools/refresh_public_networks.py || {
            echo "::warning::Stationsinventar nicht vollständig aktualisiert; letzter Stand bleibt erhalten."
            test -s tools/discovery-network-snapshot.json
          }
          python tools/refresh_discovery_pegel.py || {
            echo "::warning::Öffentliche Pegelverläufe nicht aktualisiert; letzter Stand bleibt erhalten."
            test -s tools/discovery-pegel-snapshot.json
          }

      - name: Daten speichern
        if: always()
        run: |
          for file in wasserwerte.json wassertemperatur_verlauf.json pegelkarte.json niz_temperature.json \
                      pegel-tageswerte.json temperatur_zusatz.json gkd_coords.json nlwkn_coords.json \
                      undine_coords.json berlin_coords.json assets/data/lfu-brandenburg-current.json assets/data/extra-sensors.json \
                      assets/data/river-sensor-additions.json assets/data/uk-river-sensors.json \
                      assets/data/uk-river-temperatures.json tools/discovery-network-snapshot.json \
                      tools/discovery-pegel-snapshot.json; do
            [ ! -f "$file" ] || git add "$file"
          done
          for land in AT CH NL; do
            [ ! -d "countries/$land/current" ] || git add "countries/$land/current"
          done
          bash commit_sensor_data.sh

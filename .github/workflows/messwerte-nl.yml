name: Messwerte NL
on:
  schedule:
    - cron: "22 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: messwerte-NL
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyproj
      - name: Aktuelle Messwerte ohne historische Downloads
        run: python country_pipeline.py NL
      - name: Land speichern
        run: |
          git add countries/NL/current
          bash commit_sensor_data.sh

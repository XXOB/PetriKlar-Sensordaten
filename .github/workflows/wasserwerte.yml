name: PetriKlar-Sensordaten aktualisieren

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: petriklar-sensordaten
  cancel-in-progress: true

jobs:
  update:
    name: Amtliche Messwerte abrufen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright und Chromium installieren
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wasserwerte abrufen
        timeout-minutes: 25
        run: python fetch_wasserwerte.py

      - name: Daten und Stationscaches speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wasserwerte.json wassertemperatur_verlauf.json
          [ -f temperatur_zusatz.json ] && git add temperatur_zusatz.json || true
          [ -f gkd_coords.json ] && git add gkd_coords.json || true
          [ -f nlwkn_coords.json ] && git add nlwkn_coords.json || true
          [ -f undine_coords.json ] && git add undine_coords.json || true
          [ -f berlin_coords.json ] && git add berlin_coords.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Messwerte aktualisiert ($(date -u +'%Y-%m-%d %H:%MZ'))"
            git pull --rebase origin main
            git push
          else
            echo "Keine Änderungen an den Messwerten."
          fi

      - name: Öffentlichen Datenordner erzeugen
        run: |
          mkdir -p _site
          cp wasserwerte.json _site/
          cp wassertemperatur_verlauf.json _site/
          [ ! -f temperatur_zusatz.json ] || cp temperatur_zusatz.json _site/
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetriKlar Sensordaten</title><body><h1>PetriKlar Sensordaten</h1><p>Öffentliche, automatisiert konsolidierte Messdaten.</p><ul><li><a href="wasserwerte.json">Aktuelle Wasserwerte</a></li><li><a href="wassertemperatur_verlauf.json">Temperaturverlauf</a></li></ul></body></html>
          EOF

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Daten als Pages-Artefakt packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Datendateien veröffentlichen
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4


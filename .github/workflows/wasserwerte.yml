name: Messwerte DE

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: messwerte-DE
  cancel-in-progress: false

jobs:
  update:
    name: Amtliche Messwerte abrufen
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright und Chromium installieren
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pyproj
          python -m playwright install --with-deps chromium

      - name: Wasserwerte abrufen
        timeout-minutes: 25
        env:
          PETRIKLAR_COUNTRY: DE
        run: python fetch_wasserwerte.py

      - name: Pegelkarte mit amtlichen Kennwerten aktualisieren
        timeout-minutes: 6
        run: |
          python fetch_water_levels.py --output pegelkarte.json --austria wasserwerte.json || {
            echo "::warning::Pegelabruf fehlgeschlagen; letzter datierter Stand bleibt erhalten."
            test -s pegelkarte.json
          }

      - name: Daten speichern
        run: |
          git add wasserwerte.json wassertemperatur_verlauf.json pegelkarte.json
          for file in temperatur_zusatz.json gkd_coords.json nlwkn_coords.json undine_coords.json berlin_coords.json; do
            [ ! -f "$file" ] || git add "$file"
          done
          bash commit_sensor_data.sh
